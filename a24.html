<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>A24 • Top-10 Cosine Similar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{}}};</script>
  <style>
    .line-clamp-2{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  </style>
</head>
<body class="min-h-screen bg-neutral-900 text-white">
  <div id="root" class="max-w-6xl mx-auto px-6 py-10"></div>

  <script>
  // --- helpers ---
  const $ = sel => document.querySelector(sel);
  const h = (t, p={}, ...c)=>{const e=document.createElement(t);Object.assign(e,p);c.flat().forEach(x=>e.append(x.nodeType?x:document.createTextNode(x)));return e;}
  const getQ = k => new URL(location).searchParams.get(k);
  const setQ = (k,v)=>{const u=new URL(location); v?u.searchParams.set(k,v):u.searchParams.delete(k); history.pushState({},'',u)}
  const parseCSV = (txt)=>{
    const lines = txt.split(/\r?\n/).filter(Boolean);
    if(!lines.length) return [];
    const head = lines[0].split(',');
    return lines.slice(1).map(line=>{
      let inQ=false,buf="",out=[];
      for(const ch of line){
        if(ch==='\"'){ inQ=!inQ; continue; }
        if(ch===',' && !inQ){ out.push(buf); buf=""; continue; }
        buf+=ch;
      }
      out.push(buf);
      const o={}; head.forEach((h,i)=>o[h.trim()]=(out[i]??'').trim()); return o;
    });
  };
  const simColor = s => s>=0.65?'bg-emerald-500':(s>=0.45?'bg-amber-500':'bg-zinc-400');

  // --- data loads ---
  async function loadJSON(path){ const r=await fetch(path,{cache:'no-store'}); if(!r.ok) return {}; return r.json(); }
  async function loadSims(){
    const r = await fetch('/data/similarities.json',{cache:'no-store'});
    if (r.ok){ return {kind:'json', data: await r.json()}; }
    const rc = await fetch('/data/top_similar_per_a24.csv',{cache:'no-store'});
    if (!rc.ok) return {kind:'csv', data: []};
    return {kind:'csv', data: parseCSV(await rc.text())};
  }

  // --- UI ---
  function Poster(url, alt, cls=''){
    return url
      ? h('img',{src:url,alt, className:`object-cover rounded-lg border border-neutral-700 ${cls}`})
      : h('div',{className:`rounded-lg bg-neutral-800 border border-neutral-700 ${cls}`});
  }

  function gridItem(card){
    const btn = h('button',{className:'text-left group', onclick:()=>{ setQ('film',card.slug); render(); }});
    btn.append(
      h('div',{className:'relative'},
        Poster(card.poster, card.title, 'w-full aspect-[2/3]'),
        h('div',{className:'absolute inset-0 ring-0 group-hover:ring-2 ring-emerald-400/60 rounded-lg transition'})
      ),
      h('div',{className:'mt-2'},
        h('div',{className:'font-medium leading-tight line-clamp-2'}, card.title),
        h('div',{className:'text-xs text-neutral-400'}, card.year??'—')
      )
    );
    return btn;
  }

  function recRow(rec, posters){
    const row = h('div',{className:'flex items-center gap-4 py-3'});
    row.append(
      h('div',{className:'w-5 shrink-0 text-xs tabular-nums text-neutral-300'}, rec.rank),
      Poster(posters[rec.slug], rec.title, 'w-10 h-14'),
      h('div',{className:'flex-1 min-w-0'},
        h('div',{className:'flex items-center justify-between gap-3'},
          h('div',{className:'font-medium truncate'}, rec.title),
          h('div',{className:'text-xs tabular-nums text-neutral-300'}, rec.score.toFixed(2))
        ),
        h('div',{className:'h-2 bg-neutral-700 rounded mt-1'},
          h('div',{className:`h-2 rounded ${simColor(rec.score)}`, style:`width:${Math.max(4,Math.min(100,Math.round(rec.score*100)))}%`})
        )
      )
    );
    return row;
  }

  // --- state + render ---
  let META={}, POSTERS={}, SIMS={kind:null,data:null};

  function buildA24List(){
    // A24 set = keys of similarities (json) or unique a24_slug (csv)
    let slugs = [];
    if (SIMS.kind==='json'){ slugs = Object.keys(SIMS.data||{}); }
    else if (SIMS.kind==='csv'){ slugs = Array.from(new Set((SIMS.data||[]).map(r=>r.a24_slug))); }
    const cards = slugs.map(slug=>{
      const m = META[slug]||{};
      return {
        slug,
        title: m.title || m.query_title || slug,
        year: m.year,
        poster: POSTERS[slug]
      };
    });
    // newest first, then alpha
    cards.sort((a,b)=> (b.year||0)-(a.year||0) || (a.title||'').localeCompare(b.title||''));
    return cards;
  }

  function getDetail(slug){
    const m = META[slug]||{};
    let recs=[];
    if (SIMS.kind==='json'){
      recs = (SIMS.data[slug]||[]).slice(0,10).map((d,i)=>({ rank:i+1, slug:d.slug, title:d.title, score:+d.score }));
    } else {
      const rows = (SIMS.data||[]).filter(r=>r.a24_slug===slug);
      rows.sort((a,b)=>(+a.rank||0)-(+b.rank||0) || (+b.score-+a.score));
      recs = rows.slice(0,10).map((r,i)=>({ rank: i+1, slug:r.rec_slug, title:r.rec_title, score:+r.score }));
    }
    return {
      slug,
      title: m.title || m.query_title || slug,
      year: m.year,
      poster: POSTERS[slug],
      recs
    };
  }

  function render(){
    const root = $('#root');
    root.innerHTML='';
    const selected = getQ('film');

    // Header
    root.append(
      h('h1',{className:'text-3xl md:text-5xl font-semibold tracking-tight'}, 'A24 • Top-10 Similar')
    );

    if (!selected){
      // GRID
      const list = buildA24List();
      root.append(h('p',{className:'mt-2 text-neutral-300'}, 'Click any A24 film to see its top 10 cosine-similar titles.'));
      const grid = h('div',{className:'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 mt-6'});
      list.forEach(card=> grid.append(gridItem(card)));
      root.append(grid);
    } else {
      // DETAIL
      const d = getDetail(selected);
      root.append(
        h('button',{className:'mt-2 text-sm text-neutral-300 hover:text-white underline underline-offset-4', onclick:()=>{ setQ('film',null); render(); }}, '← Back to A24')
      );

      const hero = h('section',{className:'mt-6 grid grid-cols-1 md:grid-cols-[220px,1fr] gap-6'});
      hero.append(
        h('div',{}, Poster(d.poster, d.title, 'w-[220px] h-[330px]')),
        h('div',{},
          h('h2',{className:'text-2xl md:text-3xl font-semibold'}, d.title, d.year? h('span',{className:'text-neutral-400 text-xl'}, ` (${d.year})`):'')
        )
      );
      root.append(hero);

      const box = h('section',{className:'mt-10 bg-neutral-800 border border-neutral-700 rounded-2xl overflow-hidden'});
      box.append(
        h('div',{className:'px-5 py-4 border-b border-neutral-700'}, h('h3',{className:'text-xl'}, 'Top 10 similar films')),
        h('div',{className:'p-5 divide-y divide-neutral-700'},
          ...d.recs.map(r=> recRow(r, POSTERS))
        )
      );
      root.append(box);
    }

    // footer
    root.append(
      h('footer',{className:'text-neutral-400 text-xs mt-10'}, 'Posters/metadata © TMDB. Cosine similarity from reviewer-path co-occurrence. Sample is small; scores indicate directional affinity.')
    );
  }

  // bootstrap
  (async function init(){
    const [meta, posters, sims] = await Promise.all([
      loadJSON('/data/tmdb_movies.json'),
      loadJSON('/data/posters.json'),
      loadSims()
    ]);
    META = meta || {};
    POSTERS = posters || {};
    SIMS = sims;
    render();
    window.addEventListener('popstate', render);
  })();
  </script>
</body>
</html>
