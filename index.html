<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SAMIR</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
  <style>
    .cursor-text {
      position: fixed;
      pointer-events: none;
      font-size: 1.0rem;
      font-family: 'SecondaryFont';
      letter-spacing: 0.05em;
      opacity: 0.7;
      white-space: nowrap;
      transform: translate(15px, 15px);
      z-index: 9999;
    }
  </style>
</head>
<body class="scanner-landing">

  <!-- Full-height centering wrapper -->
  <div class="vh-100 center">
    <!-- SAMIR clickable -->
    <a href="#" class="scanner-name" id="samir-link">
      <span>SAMIR</span>
    </a>
  </div>

  <!-- Cursor follower text -->
  <div class="cursor-text" id="cursor-text">click anywhere to continue</div>

  <!-- Hidden audio -->
  <audio id="instrumental" src="audio/bgsnippet.mp3"></audio>

  <script>
    // --- real viewport height fix (handles Chrome mobile address bar) ---
    function setVh() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', setVh);

    // --- cursor follower ---
    const cursorText = document.getElementById('cursor-text');
    
    document.addEventListener('mousemove', function(e) {
      cursorText.style.left = e.clientX + 'px';
      cursorText.style.top = e.clientY + 'px';
    });

    // --- existing click logic ---
    const samirLink = document.getElementById('samir-link');
    const audio = document.getElementById('instrumental');

    // Clicking anywhere else on the page → go to home immediately
    document.body.addEventListener('click', function() {
      window.location.href = 'home.html';
    });

    // Clicking SAMIR → play full mp3, then go to home
    samirLink.addEventListener('click', function(e) {
      e.stopPropagation(); // Prevent body click from firing
      e.preventDefault();

      audio.currentTime = 0; // Ensure start from beginning
      audio.play();

      audio.onended = () => {
        window.location.href = 'home.html';
      };
    });
  </script>

</body>
</html>
